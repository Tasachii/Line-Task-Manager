services:
  db:
    image: postgres:16-alpine
    container_name: ltm_postgres
    environment:
      POSTGRES_USER: line
      POSTGRES_PASSWORD: line
      POSTGRES_DB: line_task_manager
    ports:
      - "5432:5432"
    volumes:
      - ltm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U line -d line_task_manager"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  ltm_pgdata:
